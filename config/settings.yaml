# 热点看板配置
server:
  host: "0.0.0.0"
  port: 8765
  data_dir: "data"
  replay_dir: "data"
  api_key: ""   # 写接口鉴权密钥；留空则不启用（生产环境务必设置，可用环境变量 HOT_API_KEY 覆盖）

# 缓存和数据保留策略
cache:
  max_hot_days: 14        # 内存中最多保留的压缩快照天数（LRU 上限）
  raw_lru_days: 3         # 原始数据（含 group_details 消息明细）LRU 缓存天数
  retention_days: 14      # 磁盘文件保留天数（超过则删除）
  eager_load_days: 1      # 启动时预加载的最近天数；其余按需懒加载，适合低配远端

# 云端同步（本地采集后推送到云端）
cloud:
  enabled: true
  base_url: "http://47.253.54.6:8765"
  timeout: 30
  # 推送策略: "both" = 同时推送 latest + day; "latest" = 仅 latest; "day" = 仅 day
  push_mode: "both"

collector:
  max_pages: 8
  window_minutes: 30  # 实时采集覆盖窗口

